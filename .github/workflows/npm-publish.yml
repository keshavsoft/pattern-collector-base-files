name: NPM Publish and Notify

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    uses: ./.github/workflows/_npm-check.yml

  publish-pkg:
    needs: check-version
    if: needs.check-version.outputs.already_published == 'false'
    uses: ./.github/workflows/_npm-publish-reusable.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-dependents:
    needs: [check-version, publish-pkg]
    if: always() && needs.check-version.outputs.already_published == 'false' && needs.publish-pkg.result == 'success'
    uses: ./.github/workflows/_notify.yml
    with:
      package_name: ${{ needs.check-version.outputs.package_name }}
      repositories: "keshavsoft/pattern-collector-anyjs,keshavsoft/pattern-collector-anyjs-build-story,keshavsoft/ks-ai-insert-table-check"
    secrets:
      REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
